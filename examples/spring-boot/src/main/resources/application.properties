spring.application.name=bookshop
server.port=4000

# region settings
rayfold.schema=classpath:bookshop.rayfold
rayfold.explorer.enabled=true
rayfold.explorer.title=Bookshop
# endregion settings

# region identity
# Your identity provider (Auth0, Entra ID, Keycloak, Cognito, ...): Spring reads its signing keys from the issuer's
# discovery document and accepts only tokens that issuer signed for this audience. Left unset, the application signs
# and checks tokens with a development key instead (DevelopmentTokens in SecurityConfig.java).
#spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-tenant.example/
spring.security.oauth2.resourceserver.jwt.audiences=bookshop
# endregion identity
