# Real nginx in front of the Rayfold web demo (see README.md). nginx's proxy_pass sends the upstream's own Host, so the
# demo must list the public origin in RAYFOLD_ALLOWED_ORIGINS.
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  server {
    listen 8080;
    client_max_body_size 1m;
    location / {
      proxy_pass http://host.docker.internal:4610;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
    }
  }
}
