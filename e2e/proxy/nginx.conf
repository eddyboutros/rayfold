# nginx as a reverse proxy and shared cache (the job a CDN does) in front of the Rayfold web demo, for
# scripts/proxy-check.mjs. The demo runs on the same host at 127.0.0.1:4610: run nginx on the host, or in Docker with
# --network host. proxy_read_timeout is short on purpose: a live query survives it only through Rayfold's keep-alives.
events {}
http {
  proxy_cache_path cache levels=1:2 keys_zone=rayfold:10m max_size=64m inactive=10m use_temp_path=off;
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  server {
    listen 8080;
    client_max_body_size 1m;
    location / {
      proxy_pass http://127.0.0.1:4610;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      # buffering stays on, so reads can be cached; Rayfold marks its streaming responses (batches, live queries)
      # X-Accel-Buffering: no, and nginx passes those through frame by frame
      proxy_read_timeout 3s;
      # a shared cache: GET responses are cached by URL for as long as their Cache-Control allows; responses marked
      # private, or no-store, are not
      proxy_cache rayfold;
      proxy_cache_methods GET HEAD;
      proxy_cache_key "$scheme$host$request_uri";
      proxy_cache_revalidate on;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
