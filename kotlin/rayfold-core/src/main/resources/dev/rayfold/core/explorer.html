<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rayfold explorer</title>
<style>
:root { color-scheme: light dark; --ink: #16202b; --muted: #5b6875; --rule: #d6dde5; --surface: #fff; --ground: #f3f6f9; --accent: #2a78d6; --ok: #0a7d3f; --bad: #b3261e; --warn: #8a5a00; }
@media (prefers-color-scheme: dark) { :root { --ink: #e8eef5; --muted: #a2aebc; --rule: #2b333d; --surface: #171c22; --ground: #0f1318; --accent: #5aa2f0; --ok: #4cc073; --bad: #f2836f; --warn: #e3b25a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
header { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .meta { color: var(--muted); font: 12px/1.4 ui-monospace, monospace; }
main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 0; height: calc(100vh - 49px); }
@media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } }
aside { border-right: 1px solid var(--rule); overflow: auto; background: var(--surface); }
aside h2 { font: 600 11px/1 ui-monospace, monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 12px 6px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.op { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 12px; cursor: pointer; }
button.op:hover, button.op.on { background: var(--ground); }
button.op .kind { font: 11px ui-monospace, monospace; color: var(--muted); margin-left: 6px; }
section.work { display: grid; grid-template-rows: auto auto auto 1fr; min-width: 0; overflow: auto; }
.doc { padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); }
.doc h3 { margin: 0 0 4px; font-size: 15px; }
.doc dl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 10px; margin: 6px 0 0; font-size: 13px; }
.doc dt { color: var(--muted); font: 12px ui-monospace, monospace; }
.doc dd { margin: 0; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
.editor { display: grid; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; }
.tabs button { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 3px 9px; font: 12px ui-monospace, monospace; cursor: pointer; }
.tabs button.on { border-color: var(--accent); color: var(--accent); }
.tabs button.tab-close { border: 0; background: none; color: var(--muted); padding: 3px 5px; margin-left: -4px; }
.field { position: relative; }
textarea, input[type=text] { width: 100%; font: 12.5px/1.5 ui-monospace, monospace; color: inherit; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; }
textarea { min-height: 120px; resize: vertical; }
#headers { min-height: 60px; }
#token { width: 170px; }
.complete { position: absolute; z-index: 2; margin: 0; padding: 4px 0; list-style: none; min-width: 180px; max-height: 220px; overflow: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, .14); font: 12.5px/1.4 ui-monospace, monospace; }
.complete li { padding: 3px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
.complete li .kind { color: var(--muted); }
.complete li[aria-selected=true] { background: var(--accent); color: #fff; }
.complete li[aria-selected=true] .kind { color: inherit; }
.problems { margin: 0; padding: 0; list-style: none; font: 12px/1.5 ui-monospace, monospace; color: var(--warn); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row label { font-size: 12.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
button.go { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; font: 600 13px/1 inherit; cursor: pointer; min-width: 64px; }
button.go.stop { background: var(--bad); }
button.quiet { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; }
button.quiet[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
.panel { border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); padding: 8px 10px; display: grid; gap: 6px; max-height: 320px; overflow: auto; }
.panel[hidden] { display: none; }
.panel ol, .panel ul { margin: 0; padding: 0; list-style: none; }
.panel ul ul { padding-left: 18px; }
.panel li label { display: flex; gap: 6px; align-items: baseline; font: 12.5px/1.6 ui-monospace, monospace; }
.panel li .kind, .history .when { color: var(--muted); font: 11.5px ui-monospace, monospace; }
.history button { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 3px 4px; font: 12.5px ui-monospace, monospace; cursor: pointer; border-radius: 4px; }
.history button:hover { background: var(--ground); }
.views { display: flex; gap: 6px; align-items: center; padding: 8px 16px 0; }
.out { overflow: auto; padding: 12px 16px; display: grid; gap: 8px; align-content: start; }
.frame { border: 1px solid var(--rule); border-left-width: 3px; border-radius: 6px; background: var(--surface); padding: 8px 10px; min-width: 0; }
.frame pre { margin: 4px 0 0; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.frame .tag { font: 600 11px ui-monospace, monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.frame.ok, .frame.data { border-left-color: var(--ok); }
.frame.error, .frame.http { border-left-color: var(--bad); }
.frame.patch, .frame.item, .frame.at { border-left-color: var(--accent); }
.tree { font: 12px/1.6 ui-monospace, monospace; margin-top: 4px; overflow-wrap: anywhere; }
.tree details > :not(summary) { margin-left: 16px; }
.tree summary { cursor: pointer; }
.tree .k { color: var(--muted); }
.tree .string { color: var(--ok); }
.tree .number, .tree .boolean { color: var(--accent); }
.tree .null { color: var(--muted); font-style: italic; }
.hint { color: var(--muted); font-size: 12.5px; }
code { font-family: ui-monospace, monospace; }
@media (prefers-reduced-motion: no-preference) { button.go { transition: background .15s; } }
</style>
</head>
<body>
<script type="application/json" id="config">__RAYFOLD_EXPLORER_CONFIG__</script>
<header>
  <h1 id="title">Rayfold</h1>
  <span class="meta" id="about">reading the manifest...</span>
</header>
<main>
  <aside id="ops"></aside>
  <section class="work">
    <div class="doc" id="doc"><p class="hint">Pick an operation on the left. The explorer reads everything it shows from the server's manifest.</p></div>
    <div class="editor">
      <div class="tabs" id="tabs" role="group" aria-label="Requests"></div>
      <div class="field">
        <textarea id="req" spellcheck="false" aria-label="Request" aria-autocomplete="list" aria-controls="complete"></textarea>
        <ul class="complete" id="complete" role="listbox" aria-label="Suggestions" hidden></ul>
      </div>
      <ul class="problems" id="problems" aria-live="polite"></ul>
      <div class="row">
        <button class="go" id="send">Send</button>
        <label><input type="checkbox" id="simulate"> dry run</label>
        <label><input type="checkbox" id="live"> live</label>
        <label>auth <input type="text" id="token" placeholder="bearer token" autocomplete="off"></label>
        <button class="quiet" id="toggle-shape" aria-pressed="false" aria-controls="shape-panel">Shape</button>
        <button class="quiet" id="toggle-headers" aria-pressed="false" aria-controls="headers-panel">Headers</button>
        <button class="quiet" id="toggle-history" aria-pressed="false" aria-controls="history-panel">History</button>
        <button class="quiet" id="curl">Copy as curl</button>
        <span class="hint" id="status"></span>
        <span class="hint" id="note" aria-live="polite"></span>
      </div>
      <div class="panel" id="shape-panel" hidden></div>
      <div class="panel" id="headers-panel" hidden>
        <label class="hint" for="headers">Headers sent with every request, as a JSON object of names to values</label>
        <textarea id="headers" spellcheck="false" placeholder='{ "x-tenant": "acme" }'></textarea>
        <label class="hint"><input type="checkbox" id="remember"> keep the token and these headers in this browser</label>
      </div>
      <div class="panel history" id="history-panel" hidden><ol id="history"></ol></div>
      <p class="hint">A batch can hold several ops, and a later one can use an earlier result: <code>{"$ref": "1.id"}</code> in its args. Ctrl+Enter sends; Ctrl+Space suggests.</p>
    </div>
    <div class="views" role="group" aria-label="Response">
      <button class="quiet" id="view-frames" aria-pressed="true">Frames</button>
      <button class="quiet" id="view-result" aria-pressed="false">Result</button>
      <button class="quiet" id="copy-frames">Copy frames</button>
    </div>
    <div class="out" id="out"></div>
  </section>
</main>
<script>
var CONFIG = JSON.parse(document.getElementById("config").textContent);
var $ = function (sel) { return document.querySelector(sel); };
var NL = String.fromCharCode(10);
var HISTORY = 50;
var STORE = "rayfold-explorer:" + CONFIG.endpoint;
var manifest = null;
var current = null;
var running = null;
var view = "frames";
var openNodes = {};
var shown = { request: null, frames: [], http: null, type: "", raw: null, ms: 0, bytes: 0, ended: "", local: null };
var state = { tabs: [{ op: null, text: "", simulate: false, live: false }], active: 0, history: [], remember: false };

document.getElementById("title").textContent = CONFIG.title;

function text(node, s) { node.textContent = s; return node; }
function el(tag, cls, s) { var n = document.createElement(tag); if (cls) n.className = cls; if (s !== undefined) n.textContent = s; return n; }
function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
function typeName(t) {
  if (!t) return "?";
  if (t.kind === "list") return "[" + typeName(t.of) + "]" + (t.nullable ? "?" : "");
  var args = t.args && t.args.length ? "<" + t.args.map(typeName).join(", ") + ">" : "";
  return t.name + args + (t.nullable ? "?" : "");
}
function annotationsOf(def, name) { return (def.annotations || []).filter(function (a) { return a.name === name; }); }
function costOf(def) {
  var c = annotationsOf(def, "cost")[0];
  if (!c) return "default";
  return Object.keys(c.args).map(function (k) { return k + " " + JSON.stringify(c.args[k]); }).join(", ");
}
function policiesOf(def) {
  var names = [];
  annotationsOf(def, "allow").forEach(function () { names.push("allow"); });
  annotationsOf(def, "deny").forEach(function () { names.push("deny"); });
  return names.length ? names.join(", ") : "none on the operation";
}

// ---------------------------------------------------------------- types, as the manifest describes them

/** A type reference with a generic's parameters replaced by what they were bound to. */
function bound(ref, bind) {
  if (!ref) return ref;
  if (ref.kind === "list") return { kind: "list", of: bound(ref.of, bind), nullable: ref.nullable };
  if (bind && bind[ref.name]) return bind[ref.name];
  if (!ref.args || !ref.args.length) return ref;
  return { kind: "named", name: ref.name, nullable: ref.nullable, args: ref.args.map(function (a) { return bound(a, bind); }) };
}
/** The named type under any lists, with the bindings its own parameters get: Page<Book> knows its items are Books. */
function typeAt(ref, bind) {

  if (!r || !manifest) return null;
  var def = manifest.schema.types[r.name];
  if (!def) return null;
  var mine = {};
  (def.typeParams || []).forEach(function (p, i) { if (r.args && r.args[i]) mine[p] = r.args[i]; });
  return { name: r.name, def: def, bind: mine };
}
function fieldsOf(t) { return t && t.def && t.def.fields && t.def.kind !== "input" ? t.def.fields : null; }
function fieldOf(t, name) { var fs = fieldsOf(t) || []; for (var i = 0; i < fs.length; i++) if (fs[i].name === name) return fs[i]; return null; }
function isLeaf(t) { return !t || t.def.kind === "scalar" || t.def.kind === "enum"; }
/** What a selection on this type may narrow to: a union's members, or the entities that implement an interface. */
function membersOf(t) {
  if (!t) return [];
  if (t.def.kind === "union") return t.def.members.slice().sort();
  if (!t.def.interface) return [];
  var types = manifest.schema.types;
  return Object.keys(types).filter(function (n) { return (types[n].implements || []).indexOf(t.name) >= 0; }).sort();
}
/** Whether an object of this concrete type is selected by ...on cond. */
function matches(type, cond) {
  if (!type || !manifest) return type === cond;
  if (type === cond) return true;
  var c = manifest.schema.types[cond];
  if (c && c.kind === "union") return c.members.indexOf(type) >= 0;
  var d = manifest.schema.types[type];
  return !!(d && (d.implements || []).indexOf(cond) >= 0);
}
/**
 * A shape that selects the scalar fields of what an op returns: a starting point, not a rule. A field behind a policy
 * is left out, so the first send works for whoever is reading; the Shape panel adds it back.
 */
function defaultShape(typeRef, bind) {
  var t = typeAt(typeRef, bind);
  var fields = fieldsOf(t);
  if (!fields) return "";
  var open = function (f) { return !annotationsOf(f, "allow").length && !annotationsOf(f, "deny").length; };
  var scalars = fields.filter(function (f) { return !f.args.length && open(f) && isLeaf(typeAt(f.type, t.bind)); });
  var nested = t.def.typeParams ? fields.filter(function (f) { return !f.args.length && !isLeaf(typeAt(f.type, t.bind)); }) : [];

  nested.forEach(function (f) { parts.push(f.name + " " + (defaultShape(f.type, t.bind) || "{ id }")); });

}
function argSkeleton(def) {
  var args = {};
  def.args.forEach(function (a) {
    if (a.default !== undefined) { args[a.name] = a.default; return; }
    var t = a.type.kind === "list" ? a.type.of : a.type;
    var sub = manifest.schema.types[t.name];
    args[a.name] = a.type.kind === "list" ? [] : sub && sub.kind === "enum" ? sub.values[0].name : t.name === "Int" || t.name === "Float" || t.name === "Long" ? 0 : t.name === "Boolean" ? false : "";
  });

// ---------------------------------------------------------------- shapes (spec 02)

function shapeError(message, at) { var e = new Error(message); e.at = at; return e; }
function tokenizeShape(src) {

  while (i < src.length) {
    var c = src.charAt(i);
    if (c === " " || c === "\t" || c === "\r" || c === NL || c === ",") { i++; continue; }
    if (c === "/" && src.charAt(i + 1) === "/") { while (i < src.length && src.charAt(i) !== NL) i++; continue; }
    if (c === "/" && src.charAt(i + 1) === "*") { var end = src.indexOf("*/", i + 2); if (end < 0) throw shapeError("unterminated comment", i); i = end + 2; continue; }
    if (src.substr(i, 3) === "...") { out.push({ t: "p", v: "...", at: i }); i += 3; continue; }
    if ("{}():@$[].".indexOf(c) >= 0) { out.push({ t: "p", v: c, at: i }); i++; continue; }

      var j = i + 1;

/**

// ---------------------------------------------------------------- frames into a result (spec 04 §2, spec 13)

function keyOf(o) {

function setEntity(s, key, value) {
  eachObject(s, function (obj, own) {
    if (keyOf(obj) !== key) return;

  });

  });

      if (box.checked) { var add = { kind: "field", name: f.name }; if (!isLeaf(sub)) add.shape = starter(sub); items.push(add); }
      else items.splice(items.indexOf(plainField(items, f.name)), 1);
      writeShape(target, shape);
    };
    label.appendChild(box);
    label.appendChild(document.createTextNode(f.name));
    label.appendChild(el("span", "kind", typeName(bound(f.type, t.bind)) + (f.args.length ? " · takes " + f.args.map(function (a) { return a.name; }).join(", ") : "")));
    li.appendChild(label);
    if (item && !isLeaf(sub)) {
      if (!item.shape) item.shape = { items: [] };
      li.appendChild(shapeLevel(item.shape.items, sub, shape, target));
    }
    ul.appendChild(li);
  });
  membersOf(t).forEach(function (m) {
    var li = el("li");
    var label = el("label");
    var box = el("input");
    box.type = "checkbox";
    box.dataset.on = m;
    var cond = condition(items, m);
    box.checked = !!cond;
    var mt = typeAt({ kind: "named", name: m, nullable: false }, {});
    box.onchange = function () {
      if (box.checked) items.push({ kind: "on", type: m, shape: starter(mt) });
      else items.splice(items.indexOf(condition(items, m)), 1);
      writeShape(target, shape);
    };
    label.appendChild(box);
    label.appendChild(document.createTextNode("...on " + m));
    li.appendChild(label);
    if (cond) li.appendChild(shapeLevel(cond.shape.items, mt, shape, target));
    ul.appendChild(li);
  });
  return ul;
}
function renderShapePanel() {
  var host = $("#shape-panel");
  if (host.hidden) return;
  host.innerHTML = "";
  var target = shapeTarget();
  if (!target) { host.appendChild(el("p", "hint", current ? "The request holds no " + current.name + " op to shape." : "Pick an operation first.")); return; }
  var t = typeAt(current.returns, {});
  if (!fieldsOf(t) && !membersOf(t).length) { host.appendChild(el("p", "hint", current.name + " returns " + typeName(current.returns) + ", which has no fields to pick.")); return; }
  var shape;
  try { shape = typeof target.op.shape === "string" ? parseShape(target.op.shape) : { items: [] }; } catch (e) { host.appendChild(el("p", "hint", "The shape does not read yet: " + e.message)); return; }
  host.appendChild(shapeLevel(shape.items, t, shape, target));
}

// ---------------------------------------------------------------- operations

function firstOp() {
  if (!manifest) return null;
  var ops = Object.keys(manifest.schema.ops).map(function (n) { return manifest.schema.ops[n]; });
  return ops.filter(function (o) { return o.kind === "query"; })[0] || ops[0] || null;
}
function describe(op) {
  current = op;
  Array.prototype.forEach.call(document.querySelectorAll("button.op"), function (b) { b.classList.toggle("on", b.dataset.op === op.name); });
  var doc = document.getElementById("doc");
  doc.innerHTML = "";
  doc.appendChild(el("h3", null, op.name + "(" + op.args.map(function (a) { return a.name + ": " + typeName(a.type); }).join(", ") + ")"));
  if (op.description) doc.appendChild(el("p", "hint", op.description));
  var dl = el("dl");
  function add(k, v) { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); }
  add("kind", op.kind);
  add("returns", typeName(op.returns));
  add("cost", costOf(op));
  add("policies", policiesOf(op));
  if (op.throws && op.throws.length) add("throws", op.throws.join(" | "));
  if (op.emits && op.emits.length) add("emits", op.emits.join(" "));
  if (annotationsOf(op, "simulate").length) add("dry run", "allowed: tick it and nothing is written");
  doc.appendChild(dl);
  $("#simulate").disabled = op.kind !== "command";
  $("#live").disabled = op.kind !== "query";
}
function show(op) {
  if (running) return;
  describe(op);
  var request = { ops: [{ id: 1, op: op.name, args: argSkeleton(op) }] };
  var shape = defaultShape(op.returns, {});
  if (shape) request.ops[0].shape = shape;
  if (op.kind === "command") request.ops[0].key = "explorer-" + Math.random().toString(36).slice(2).padEnd(16, "0").slice(0, 16);
  $("#req").value = JSON.stringify(request, null, 2);
  state.tabs[state.active].op = op.name;
  renderTabs();
  edited();
}
function edited() {
  renderShapePanel();
  checkSoon();
  saveState();
}

// ---------------------------------------------------------------- what came back

function size(n) { return n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB"; }
function drawStatus() {
  if (running && shown.http === null) { $("#status").textContent = "sending..."; return; }
  var parts = [];
  if (shown.http !== null) parts.push("HTTP " + shown.http);
  parts.push(shown.frames.length + (shown.frames.length === 1 ? " frame" : " frames"));
  parts.push(shown.ms + " ms");
  parts.push(size(shown.bytes));
  if (shown.ended) parts.push(shown.ended);
  $("#status").textContent = parts.join(" · ");
}
function frameKind(f) {
  return "error" in f ? "error" : "ok" in f ? "ok" : "at" in f ? "at" : "patch" in f ? "patch" : "item" in f ? "item" : "data" in f ? "data" : "fin";
}
function box(cls, tag, body) {
  var b = el("div", "frame " + cls);
  b.appendChild(el("span", "tag", tag));
  if (body !== undefined) b.appendChild(el("pre", null, body));
  return b;
}
function drawFrames(out) {
  shown.frames.forEach(function (f) {
    var kind = frameKind(f);
    var cost = f.meta && f.meta.cost !== undefined ? "  cost " + f.meta.cost : "";
    out.appendChild(box(kind, kind + (f.id !== undefined ? " · op " + f.id : "") + cost, JSON.stringify(f, null, 2)));
  });
}
function tree(v, key, path, depth) {
  if (v === null || typeof v !== "object") {
    var leaf = el("div", "leaf");
    if (key !== null) leaf.appendChild(el("span", "k", key + ": "));
    leaf.appendChild(el("span", v === null ? "null" : typeof v, JSON.stringify(v)));
    return leaf;
  }
  var d = el("details");
  d.open = openNodes[path] !== undefined ? openNodes[path] : depth < 3;
  d.ontoggle = function () { openNodes[path] = d.open; };
  var sum = el("summary");
  if (key !== null) sum.appendChild(el("span", "k", key + ": "));
  var arr = Array.isArray(v);
  sum.appendChild(el("span", "t", arr ? "[" + v.length + "]" : keyOf(v) ? v.$type + " " + v.id : "{" + Object.keys(v).length + "}"));
  d.appendChild(sum);
  (arr ? v.map(function (x, i) { return [String(i), x]; }) : Object.keys(v).map(function (k) { return [k, v[k]]; })).forEach(function (kv) {
    d.appendChild(tree(kv[1], kv[0], path + "." + kv[0], depth + 1));
  });
  return d;
}
function drawResult(out) {
  var states = applyFrames(shown.request, shown.frames);
  states.order.forEach(function (id) {
    var s = states.byId[id];
    var notes = [s.op, s.error ? "failed" : s.done ? "done" : running ? "open" : shown.ended || "ended"];
    if (s.stale) notes.push("stale");
    var b = box(s.error ? "error" : s.held || s.items.length ? "data" : "fin", "op " + id + " · " + notes.join(" · "));
    var holder = el("div", "tree");
    if (s.error) holder.appendChild(tree(s.error, "error", id + ".error", 0));
    if (s.held) holder.appendChild(tree(materialize(s.root), null, String(id), 0));
    if (s.items.length) holder.appendChild(tree(s.items, "items", id + ".items", 0));
    var stale = Object.keys(states.stale).filter(function (k) { return contains(s.root, k); });
    if (stale.length) holder.appendChild(el("p", "hint", "stale: " + stale.join(", ")));
    b.appendChild(holder);
    out.appendChild(b);
  });
}
function draw() {
  var out = $("#out");
  out.innerHTML = "";
  if (shown.local) out.appendChild(box("error", "explorer", shown.local));
  if (view === "frames") drawFrames(out);
  else drawResult(out);
  if (shown.raw !== null) out.appendChild(box("http", "HTTP " + shown.http + (shown.type ? " · " + shown.type : "") + " · not Rayfold frames", shown.raw || "(empty body)"));
  if (shown.request) drawStatus();
}
function setView(v) {
  view = v;
  $("#view-frames").setAttribute("aria-pressed", String(v === "frames"));
  $("#view-result").setAttribute("aria-pressed", String(v === "result"));
  draw();
}
function parseFrame(line) {
  try { var f = JSON.parse(line); return f && typeof f === "object" && !Array.isArray(f) ? f : undefined; } catch (e) { return undefined; }
}

// ---------------------------------------------------------------- sending

function requestHeaders() {
  var h = { "content-type": "application/rayfold+json" };
  var extra = $("#headers").value.trim();
  if (extra) {
    var given = JSON.parse(extra);
    if (!given || typeof given !== "object" || Array.isArray(given)) throw new Error("the headers are a JSON object of names to values");
    Object.keys(given).forEach(function (k) { h[k.toLowerCase()] = String(given[k]); });
  }
  if ($("#token").value) h.authorization = "Bearer " + $("#token").value;
  return h;
}
/** The request as it goes out: the editor's batch, with the dry-run and live boxes applied, and its headers. */
function prepared() {
  var body;
  try { body = JSON.parse($("#req").value); } catch (e) { throw new Error("the request is not JSON: " + e.message); }
  if (!body || !Array.isArray(body.ops)) throw new Error("a request is { \"ops\": [ ... ] }");
  if (current && current.kind === "command" && $("#simulate").checked) body.ops.forEach(function (o) { o.simulate = true; });
  if (current && current.kind === "query" && $("#live").checked) body.ops.forEach(function (o) { o.live = true; });
  var headers;
  try { headers = requestHeaders(); } catch (e) { throw new Error("the headers are not JSON: " + e.message); }
  return { body: body, headers: headers };
}
/** A request that never went: what was wrong with it, in place of the last response, which it would only confuse. */
function fail(message) {
  shown = { request: null, frames: [], http: null, type: "", raw: null, ms: 0, bytes: 0, ended: "", local: message };
  $("#status").textContent = "";
  draw();
}
function sending(on) {
  var b = $("#send");
  b.textContent = on ? "Stop" : "Send";
  b.classList.toggle("stop", on);
}
async function send() {
  if (running) { running.abort(); return; }
  closeSuggestions();
  var req;
  try { req = prepared(); } catch (e) { fail(e.message); return; }
  var controller = new AbortController();
  running = controller;
  sending(true);
  shown = { request: req.body, frames: [], http: null, type: "", raw: null, ms: 0, bytes: 0, ended: "", local: null };
  var started = Date.now();
  draw();
  try {
    var res = await fetch(CONFIG.endpoint, { method: "POST", headers: req.headers, body: JSON.stringify(req.body), signal: controller.signal });
    shown.http = res.status;
    shown.type = (res.headers.get("content-type") || "").split(";")[0];
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var buffered = "";
    for (;;) {
      var chunk = await reader.read();
      if (chunk.done) break;
      shown.bytes += chunk.value.byteLength;
      var piece = decoder.decode(chunk.value, { stream: true });
      if (shown.raw !== null) { if (shown.raw.length < 4000) shown.raw += piece; }
      else {
        buffered += piece;
        var cut;
        while ((cut = buffered.indexOf(NL)) >= 0) {
          var line = buffered.slice(0, cut);
          buffered = buffered.slice(cut + 1);
          if (!line.trim()) continue;
          var f = parseFrame(line);
          // a proxy's error page or a plain-text refusal: show what came, under the status it came with
          if (f === undefined) { shown.raw = line + NL + buffered; buffered = ""; break; }
          shown.frames.push(f);
        }
      }
      shown.ms = Date.now() - started;
      draw();
    }
    if (shown.raw === null && buffered.trim()) {
      var last = parseFrame(buffered);
      if (last === undefined) shown.raw = buffered;
      else shown.frames.push(last);
    }
    if (shown.raw !== null) shown.raw = shown.raw.slice(0, 4000);
  } catch (e) {
    if (controller.signal.aborted) shown.ended = "stopped";
    else { shown.ended = "failed"; shown.local = "no answer from " + CONFIG.endpoint + ": " + String(e && e.message ? e.message : e); }
  } finally {
    running = null;
    sending(false);
    shown.ms = Date.now() - started;
    remember(req.body, shown.http);
    draw();
  }
}
function flash(s) {
  var note = $("#note");
  note.textContent = s;
  setTimeout(function () { if (note.textContent === s) note.textContent = ""; }, 2500);
}
function copy(value, what) {
  var done = function () { flash(what + " copied"); };
  var fallback = function () {
    var t = el("textarea");
    t.value = value;
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.appendChild(t);
    t.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    t.remove();
    flash(ok ? what + " copied" : "this browser will not copy from here");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(value).then(done, fallback);
  else fallback();
}
function quote(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }
function curlOf(req) {
  var parts = ["curl", "-N", quote(new URL(CONFIG.endpoint, location.href).href)];
  Object.keys(req.headers).forEach(function (k) { parts.push("-H", quote(k + ": " + req.headers[k])); });
  parts.push("--data-raw", quote(JSON.stringify(req.body)));
  return parts.join(" ");
}
function toggle(button, panel, after) {
  var open = panel.hidden;
  panel.hidden = !open;
  button.setAttribute("aria-pressed", String(open));
  if (open && after) after();
}

async function start() {
  try {
    var res = await fetch(CONFIG.endpoint + "/manifest");
    // a server with its manifest turned off answers with an error frame, which parses but lists nothing
    if (!res.ok) throw new Error(String(res.status));
    manifest = await res.json();
  } catch (e) {
    text(document.getElementById("about"), "no manifest at " + CONFIG.endpoint + "/manifest");
    renderTabs();
    return;
  }
  text(document.getElementById("about"), "rayfold " + manifest.rayfold + " · schema " + String(manifest.schemaHash).slice(0, 12) + " · extensions " + (manifest.extensions || []).join(", "));
  var ops = Object.keys(manifest.schema.ops).map(function (n) { return manifest.schema.ops[n]; });
  var aside = document.getElementById("ops");
  ["query", "command", "stream"].forEach(function (kind) {
    var mine = ops.filter(function (o) { return o.kind === kind; }).sort(function (a, b) { return a.name < b.name ? -1 : 1; });
    if (!mine.length) return;
    aside.appendChild(el("h2", null, kind === "query" ? "queries" : kind === "command" ? "commands" : "streams"));
    mine.forEach(function (op) {
      var b = el("button", "op");
      b.dataset.op = op.name;
      b.appendChild(document.createTextNode(op.name));
      b.appendChild(el("span", "kind", typeName(op.returns)));
      b.onclick = function () { show(op); };
      aside.appendChild(b);
    });
  });
  renderHistory();
  if (loadState()) { renderHistory(); loadTab(); return; }
  var first = firstOp();
  if (first) show(first);
  else renderTabs();
}

$("#send").onclick = send;
$("#view-frames").onclick = function () { setView("frames"); };
$("#view-result").onclick = function () { setView("result"); };
$("#copy-frames").onclick = function () { copy(shown.frames.map(function (f) { return JSON.stringify(f); }).join(NL), "frames"); };
$("#curl").onclick = function () { try { copy(curlOf(prepared()), "curl command"); } catch (e) { fail(e.message); } };
$("#toggle-shape").onclick = function () { toggle($("#toggle-shape"), $("#shape-panel"), renderShapePanel); };
$("#toggle-headers").onclick = function () { toggle($("#toggle-headers"), $("#headers-panel")); };
$("#toggle-history").onclick = function () { toggle($("#toggle-history"), $("#history-panel"), renderHistory); };
$("#remember").onchange = function () { state.remember = $("#remember").checked; saveState(); };
$("#token").addEventListener("input", saveState);
$("#headers").addEventListener("input", saveState);
$("#simulate").onchange = saveState;
$("#live").onchange = saveState;
$("#req").addEventListener("input", function () { edited(); openSuggestions(false); });
$("#req").addEventListener("blur", closeSuggestions);
$("#req").addEventListener("keydown", function (e) {
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); if (!running) send(); return; }
  if (e.ctrlKey && e.key === " ") { e.preventDefault(); openSuggestions(true); return; }
  if (!suggest.open) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    suggest.index = (suggest.index + (e.key === "ArrowDown" ? 1 : suggest.items.length - 1)) % suggest.items.length;
    drawSuggestions();
  } else if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); acceptSuggestion(); }
  else if (e.key === "Escape") { e.preventDefault(); closeSuggestions(); }
});
start();
</script>
</body>
