version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
    # a major version changes APIs (graphql 17 did); take those by hand, together with the code they need
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gradle
    directory: /kotlin
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Spring Boot applications get the coroutines version Boot manages; code built against a newer one calls
      # functions that version does not have, so the runtime stays on the one Boot ships
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-*"
        versions: [">= 1.11.0"]
      # the published modules support Kotlin 2.2; kotlinx-serialization 1.10 and later need Kotlin 2.3
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-*"
        versions: [">= 1.10.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
