name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # the Java generator's tests compile its output with javac
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      # includes the property-based fuzz tests at their default depth; fuzz.yml runs them deeper every night
      - run: npm test
        env:
          REQUIRE_JAVAC: 1
      - name: The Kotlin oracles match what the TypeScript runtime produces
        run: |
          npx tsx scripts/kotlin-oracle.ts
          git diff --exit-code kotlin/rayfold-core/src/test/resources/oracle
      - run: npm run build
      - name: The packed packages install and work outside the repository
        run: npm run smoke:packages

  kotlin:
    name: Kotlin and Java (JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # check = the tests, plus the Android API level 26 check of the client modules
      - run: chmod +x gradlew && ./gradlew check

  docs:
    name: Docs site and web example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # fails on a broken link, and on a snippet region an example no longer has
      - run: npm run docs:build
      - run: npm run build -w @rayfold/example-react

  examples-jvm:
    name: Kotlin, Java and Spring Boot examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # publishes the runtime to the local Maven repository, then builds and tests each example against it
      - run: node scripts/examples-jvm.mjs

  browsers:
    name: Web demo in Chromium, Firefox and WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browsers

  proxy:
    name: Behind nginx as proxy and shared cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start the demo and nginx
        run: |
          RAYFOLD_ALLOWED_ORIGINS=http://localhost:8080 RAYFOLD_KEEPALIVE_MS=1000 RAYFOLD_DEMO_LIMIT=3000 npm run demo > demo.log 2>&1 &
          docker run -d --name nginx --network host -v "$PWD/e2e/proxy/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.30-alpine
          for i in $(seq 1 60); do curl -sf http://localhost:8080/me > /dev/null && break; sleep 1; done
      - run: npm run check:proxy
      - name: Logs
        if: failure()
        run: |
          cat demo.log
          docker logs nginx

  security:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    # gitleaks lists a pull request's commits through the API, which needs this beyond contents: read
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: No known vulnerability in what the published packages depend on
        run: npm audit --omit=dev --audit-level=moderate
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: --lockfile=package-lock.json
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
