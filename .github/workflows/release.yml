name: Release

# Push a tag such as v0.1.0 after `node scripts/set-version.mjs 0.1.0`. The verify job refuses a tag that does not
# match the version in the sources. docs/releasing.md lists the secrets and the one-time setup on npm and Maven Central.
on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  # both registries publish only once both runtimes pass: a version is never replaced, so one released on npm while
  # the JVM build failed would stay released without its Maven half
  verify:
    name: Test both runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: The tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./packages/schema/package.json').version")"
      - name: The tag matches the Gradle version
        run: test "${GITHUB_REF_NAME#v}" = "$(grep '^VERSION_NAME=' kotlin/gradle.properties | cut -d= -f2)"
      - run: npm ci
      - run: npm test
        env:
          REQUIRE_JAVAC: 1
      # check, not test: it holds the Android API level the client libraries promise
      - run: chmod +x kotlin/gradlew && kotlin/gradlew -p kotlin check

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance, and trusted publishing once it is set up on npmjs.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: node scripts/publish.mjs --provenance
        env:
          # leave the secret unset once every package uses npm trusted publishing
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  maven:
    name: Publish to Maven Central
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: chmod +x gradlew && ./gradlew publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: true

  github-release:
    name: GitHub release with software bills of materials
    needs: [npm, maven]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: npm ci
      - name: CycloneDX bills of materials for the npm packages and the JVM artifacts
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > rayfold-npm.cdx.json
          (cd kotlin && chmod +x gradlew && ./gradlew cyclonedxBom)
          cp kotlin/build/reports/cyclonedx/bom.json rayfold-jvm.cdx.json
      # the changelog, not --generate-notes: that lists merged pull requests, and a release lands here as commits on
      # main, so 0.2.0's page named three dependabot bumps and none of the release
      - name: Release notes from the changelog
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md rayfold-npm.cdx.json rayfold-jvm.cdx.json
        env:
          GH_TOKEN: ${{ github.token }}
